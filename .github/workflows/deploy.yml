# Compila la app de Vite (React) que vive en Ecommerce/ y la publica en GitHub Pages.
#
# POR QUE EXISTE: por defecto Pages sirve el repo con Jekyll y termina mostrando el
# README en vez de la app, porque nadie corre el build de Vite. Este workflow corre
# `vite build` de verdad y sube Ecommerce/dist como sitio.
#
# IMPORTANTE (paso manual, una vez): en el repo, Settings > Pages > Source, elegir
# "GitHub Actions". Hoy esta en "Deploy from a branch", por eso sirve Jekyll.
name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos minimos para publicar en Pages con OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy a la vez, sin cancelar el que este corriendo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ecommerce   # la app vive en el subdirectorio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Ecommerce/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npm run build

      - name: Fallback SPA
        # GitHub Pages no reescribe rutas desconocidas a index.html, asi que al
        # refrescar una ruta de react-router daria 404. Con un 404.html = index.html
        # el navegador carga la app igual y el router resuelve la ruta.
        run: cp dist/index.html dist/404.html

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: Ecommerce/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
